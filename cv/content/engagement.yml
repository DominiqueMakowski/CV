# taught in the open, free to read. The link is repeated in the description
# because a card name is linked but not coloured, and a reader of the page
# should see that there is somewhere to go.

- name: "Open Methods Tutorials"
  kind: openscience
  url: "https://realitybendinglab.com/news/"
  reach: "44 posts"
  meta: "Reality Bending Lab · 2019 - Present"
  description: >-
      Tutorials for early-career researchers on Bayesian statistics, reaction
      times and GitHub, and essays on research culture and AI, on the
      [lab blog](https://realitybendinglab.com/news/).

# The figure is the blog's, which is why the blog comes first in the
# description. The lab's posts are not counted with it: they are written for
# researchers, and have the card above.

