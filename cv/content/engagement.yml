# Engagement and knowledge exchange, as one row of three columns of cards.
#
#   openscience  Open Science and Public Engagement: who was reached, the
#                research community first and the public after it. The
#                default kind.
#   consultancy  Consultancy: advice and development for outside clients.
#   contract     Contract Research and Teaching: work delivered under contract.
#
# Card fields as in grants-awards.yml.
#
# One row of three rather than two rows of two, so that Science Adjacent
# Projects, which closes the section, sits on the same page as it. The public
# engagement used to be a column of its own, of three cards; it is now one
# card at the foot of the open science column. Most of it is from 2014 - 18,
# and a column of its own weighed it the same as the current open science
# work. The blog readership is the one hard reach figure it has, so the card
# leads on the blog, and carries its number.
#
# Before that the section was one "Public Engagement and Outreach" column
# holding a debate for neuroscientists, tutorials for early-career researchers
# and a list of media appearances side by side, which read as a set of unlike
# things. The open science advocacy - the thread the two SIPS awards and the
# Openness in Research Award point at - still leads the column.
#
# The open science column is wider than the other two (1.7 : 1 : 1, in
# typst-template.typ), because it holds three cards to their two, and its
# cards have the longer descriptions. The descriptions in it are
# about 110 characters rather than the 160 of the two-column sections.
#
# This is the outward-facing work that service.yml deliberately leaves out so
# that it can answer one question. MORSE was here for a while and went back to
# service.yml: it is a Sussex seminar series he convenes, which is what that
# column lists.
# The invited doctoral teaching (Basel, Zurich, Paris, OHBM) is on the Invited
# teaching card in teaching-roles.yml. The two contracted workshops of it,
# Basel and Zurich, are also named on the Contracted Instructor card below.
#
# Sources: PROFILE.md > Service and Leadership (Open Science and Research
# Culture), Consultancy and Knowledge Exchange, Talks and Media (Science
# Blogging, Media and Public Engagement). Clients recorded as confidential
# there stay confidential here.
#
# The ESCAN Artificial Emotion symposium used to be an outreach card here. It
# moved to talks.yml, onto the Symposia chaired card beside the ASSC one:
# two near-identical credentials in two different sections read as a
# duplicate rather than as two achievements.

# --- Open Science and Public Engagement -------------------------------------

- name: "Open Science Champion"
  kind: openscience
  reach: "2024"
  meta: "British Neuroscience Association (BNA)"
  description: >-
      Invited to argue for *openness* vs. *sustainability* in the meeting's
      debate, against Charlotte Rae as the Sustainability Champion.

