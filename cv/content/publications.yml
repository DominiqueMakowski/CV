# Publications, as themed lists. This file holds DECISIONS, not facts: which
# theme a paper argues for, what order the themes run in, and whether the CV
# shows a given entry at all. The facts - authors, titles, venues, DOIs - are in
# ../../publications.bib and are referenced here only by cite key.
#
# That split is the same one the repo runs on a level up (PROFILE.md holds the
# record, content/*.yml holds the argument), and it exists because a theme is an
# editorial judgement that no database can supply, while a page range is a fact
# that prose has no business restating.
#
# Keys must exist in the .bib; `python tools/validate.py` fails on a key that
# does not, and on a .bib entry that no theme claims - so a new publication
# cannot be added to the bibliography and silently left off the CV.
#
# Fields:
#
#   themes       ordered; each renders as a subheading.
#     name       the subheading.
#     keys       cite keys, in the order they should appear. Entries with no
#                year in the .bib (under review) sort to the top of their theme
#                whatever order they are given in.
#   hidden       cite keys present in the .bib but deliberately off the CV.
#                Listed here rather than deleted, so the reason survives and the
#                entry can be switched back on for a tailored version. This is
#                the YAML equivalent of the commented-out blocks in the old Rmd.
#   highlight    cite keys to mark with a dot in the margin. Used sparingly:
#                these are the papers the CV is making an argument with.

