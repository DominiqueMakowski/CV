# What can be taught, grouped into three overarching areas so that a reader can
# place the fit at a glance.
#
# A mapping, not a list:
#
#   lead    the italic paragraph under the section heading: how long the
#           teaching has run, at what level, and how the table is organised.
#   areas   the rows. group (opens a labelled band), area, level (accent),
#           topics, where (the small line of provenance underneath).
#
# The group names are deliberately Oxford's own, taken from the Experimental
# Psychology job description (applications/Jobs/2026_oxford/description.pdf):
#
# - "Individual Differences and Clinical Psychology" is the name of their
#   second-year paper (IDCP), and the one area the description names twice as
#   core tutorial teaching.
# - "Cognition" and "Psychobiology" are two of the three sections of their
#   first-year Introduction to Psychology paper (the third is Perception, which
#   is not claimed here because it has not been taught). The group carries those
#   two words so that the rows underneath do not have to.
#
# For a different department these revert to generic names - "Neuroscience and
# Cognition", "Clinical Neuropsychology" - without touching the rows. Only the
# first group name, "Methods and Statistics", is department-neutral already.
#
# `where` is what makes the rest credible: institution, hours and dates. Hours
# are the "equivalent TD" figures from the Paris teaching service, per
# PROFILE.md > Academic Teaching. The Sussex modules are ongoing and carry dates
# only.
#
# No module names. They were only ever given for Sussex, which made the line
# read differently on half the rows, and a title outside its own institution
# says nothing the area name has not already said - "Topics in Neuroscience"
# under Psychophysiology is a label, not evidence. The lead says the areas are
# grouped rather than listed module by module; this is that, kept to.

lead: >-
    I have been teaching at university level since 2013, and I am a Fellow of the Higher
    Education Academy (FHEA). At Sussex my involvement is primarily with advanced and
    postgraduate courses, but I am equally comfortable with introductory and undergraduate
    content.

areas:
    - group: "Methods and Statistics"
      area: "Bayesian Statistics"
      level: "MSc · PhD"
      topics: >-
          *Module convenor*; designed from scratch. The Bayesian framework, estimation and inference; multilevel and cognitive
          models with brms.
      where: "University of Sussex · 2024 - Present"

    - group: "Methods and Statistics"
      area: "Advanced Statistics"
      level: "BSc · MSc · PhD"
      topics: >-
          Regression and mixed models; psychometrics; experimental methodology and
          scientific reasoning. *Taught in R*.
      where: "University of Sussex · 2023 - Present · Université Paris Cité · 19 h · 2017 - 18"

    - group: "Methods and Statistics"
      area: "Programming and Tools"
      level: "MRes · PhD"
      topics: >-
          Online experiment building with JavaScript; signal processing with *Python*; version control
          and collaboration with *GitHub*; Open data and materials; *agentic coding (AI)* tools for research.
      where: "University of Sussex · 2025 · University of Zurich · 24 h · 2022"

    - group: "Cognition and Psychobiology"
      area: "Psychophysiology"
      level: "BSc · MSc"
      topics: >-
          Neurophysiological signal recording and preprocessing; heart rate variability;
          interoception; embodied cognition.
      where: "University of Sussex · 2023 - Present · University of Basel · 8 h · 2024"

    - group: "Cognition and Psychobiology"
      area: "Cognitive Neuroscience"
      level: "BSc"
      topics: >-
          Neuroanatomy; memory; emotion regulation; neuroimaging; mindfulness and
          meditation.
      where: "Université Paris Cité · 90 h · 2017 - 18"

    - group: "Cognition and Psychobiology"
      area: "Cognitive Psychology"
      level: "BSc"
      topics: "Models of working memory; mental imagery and categorisation."
      where: "Université Paris Cité · 48 h · 2014 - 16"

    - group: "Individual Differences and Clinical Psychology"
      area: "Individual Differences"
      level: "BSc"
      topics: "Intelligence; personality; creativity."
      where: "Université Paris Cité · 144 h · 2015 - 17"

    - group: "Individual Differences and Clinical Psychology"
      area: "Clinical Neuropsychology"
      level: "BSc"
      topics: >-
          Neuropsychological syndromes; neuropsychological examination, diagnosis
          and psychometrics; neuropsychology in psychiatry.
      where: "Université Paris Cité · 51 h · 2017 - 18"

    - group: "Individual Differences and Clinical Psychology"
      area: "Rehabilitation and Practice"
      level: "MSc"
      topics: >-
          Cognitive rehabilitation and intervention; neuropsychology and disability;
          neurodegenerative and neurodevelopmental disorders; clinical practice
          supervision.
      where: "Université Paris Cité · 29 h · 2017 - 18"
