# Side projects: what was made outside the job, as one row of cards under a
# single label. Card fields as in software.yml, with `logo` a picture in
# img/projects/ rather than a mark. No `kind`: this section is one band, not
# two columns, so there is nothing for it to pick.
#
# The bar for this section is that somebody else took it seriously: the
# artwork was selected for an exhibition, the game was played by people who
# were not asked to. A hobby with neither is a hobby, and PROFILE.md > Side
# Projects is where those live.
#
# Sources: PROFILE.md > Side Projects. The pictures are the artwork itself -
# subject 1, the heart recorded while lying, which is the densest of them and
# the only one that survives being 66pt wide - and the back of a card.

- name: "NeuropsyXart"
  url: "https://dominiquemakowski.github.io/NeuropsyXart/"
  logo: "neuropsyxart.jpg"
  reach: "OHBM 2023"
  meta: "Brain Art Exhibition, Montreal · Selected"
  description: >-
    A person's heart or brain activity, recorded during a mental experience and
    drawn as the *attractor* of that signal: a portrait made of physiology,
    where the artist is only the facilitator.

- name: "Reality Check!"
  logo: "realitycheck.jpg"
  reach: "In testing"
  meta: "Card game · Beta-tested in the lab, 2024"
  description: >-
    A bluffing card game built on the *Ebbinghaus illusion*: play a circle the
    same size or bigger than the last, and call the bluff when your eyes
    disagree. Out of the lab's work on illusion sensitivity.
