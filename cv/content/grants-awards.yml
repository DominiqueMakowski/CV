# Grants and awards, as two columns of cards: `kind: grant` on the left,
# `kind: award` on the right. Both are reverse chronological.
#
# Fields: name (the work the money paid for, or the award), reach (the figure in
# the corner - the amount for a grant, the year for an award), meta (funder,
# scheme, role and dates, small caps under the name), description (what an award
# was for), url, kind.
#
# A grant is named for its project, not its scheme: "Behavioural and
# Communication Science Programme" tells a reader nothing about the research, and
# the scheme belongs with the funder on the line underneath. Project names here
# are the heads of the full titles, which are in PROFILE.md.
#
# Amounts are approximate sterling equivalents, rounded to the nearest thousand.
# All four grants were awarded in US dollars; PROFILE.md > Grants holds the
# awarded figures. The rate used is 0.716, which is the one ORCID records for the
# Centre for Open Science award - USD 28,163 entered there as GBP 20,175 - so the
# four sit on a single documented basis rather than on four different days'
# rates. They are approximations and should not be quoted as exact.
#
#   Centre for Open Science          USD  28,163
#   Temasek Laboratories, NTU        USD 915,427
#   Singapore NRF                    USD 249,730
#   NTU Presidential Fellowship      USD 360,000  (whole award, salary included;
#                                                  the research budget within it
#                                                  was roughly USD 200,000)

# An application, not an award, and marked as one in the corner where every
# other card carries money: "Under review" is the honest figure until the
# panel reports. The amount is on the line underneath so that the size of the
# bid is still legible. Submitted 31 August 2026; the outcome is expected in
# 2027. Drop this card, or move the euros into the corner, when it is decided.

- name: "Measuring the Deep Self"
  kind: grant
  reach: "€58,843"
  meta: >-
      BIAL Foundation · Grants Programme 2026/27 · Under review
  description: >-
      Prior-weighting in predictive processing as a single trait across belief
      updating, perception and self-reference.

- name: "Illusion Sensitivity and Phenomenological Control"
  kind: grant
  url: "https://www.cos.io/blog/funding-consciousness-research"
  reach: "£20,000"
  meta: >-
      Centre for Open Science · Registered Reports in Consciousness Research ·
      PI · 2024 - 26

- name: "Perception of Real vs. Fake Information"
  kind: grant
  reach: "£655,000"
  meta: >-
      Temasek Laboratories, NTU · Behavioural and Communication Science
      Programme · co-PI · 2022 - 25

- name: "Crowdedness and Environment Typology (NICE)"
  kind: grant
  reach: "£179,000"
  meta: >-
      Singapore National Research Foundation · Intra-CREATE Grant · co-PI ·
      2021 - 22

- name: '"That''s Fake News": Belief in Deceptive Information'
  kind: grant
  reach: "£258,000"
  meta: >-
      Nanyang Technological University · Presidential Postdoctoral Fellowship ·
      PI · 2020 - 22

