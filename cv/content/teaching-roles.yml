# The teaching roles that are not topics: what is designed and convened on the
# left (`kind: convening`), who is supervised and examined on the right
# (`kind: supervision`). Card fields, as in grants-awards.yml and software.yml.
#
# The left column runs down the scale of what was built - a programme, then a
# module, then the teaching tools, then the workshops - rather than by date,
# because that is the order the question is asked in.
#
# The MSc Advanced Computational Psychology programme is curriculum design, so
# it leads here; service.yml keeps a short card for the institutional side of
# the same work rather than the detail.
#
# The FHEA is a sentence in the lead paragraph of teaching-areas.yml rather
# than a card. A qualification is one line of fact, and given a card the size
# of a convened module it read as the equal of one.

- name: "MSc Programme development"
  kind: convening
  reach: "2026"
  meta: "University of Sussex"
  description: >-
      Leading the design of a new programme, *MSc Advanced Computational Psychology*: curriculum, modules and learning outcomes.

- name: "Module design"
  kind: convening
  reach: "2024"
  meta: "University of Sussex"
  description: >-
      Created *Bayesian Statistics*, a new master's and PhD module, rated by students as one of the most engaging.

# The one piece of teaching innovation that is a thing rather than a claim: a
# game, playable at the link, built for the statistics modules. It sits after
# the module because it serves the modules. "Innovative teaching" is in `meta`
# on purpose - it is the phrase job descriptions ask for, and the card is the
# evidence for it. Still a prototype, not yet used in class or evaluated, and
# the card says so. Source: ../PROFILE.md > Academic Teaching > Stats & Sorcery.

- name: "Game-based learning"
  kind: convening
  url: "https://dominiquemakowski.github.io/StatsAndSorcery/"
  reach: "Prototype"
  meta: "Innovative teaching · Open source"
  description: >-
      [*Stats & Sorcery*](https://dominiquemakowski.github.io/StatsAndSorcery/), a game teaching statistical intuition through play.

# The invitations only. The Basel and Zurich workshops were paid contracts and
# are on the Contracted Instructor card in engagement.yml; the pointer at the
# end ties the two together without listing them twice.

- name: "Invited teaching"
  kind: convening
  reach: "2021 - 24"
  meta: "Paris · Singapore · OHBM"
  description: >-
      Workshops for researchers and PhD students on Bayesian statistics, mixed
      models and physiological signals. See also *Contracted Instructor*.

# The right column leads with the count rather than the dates, as the grant and
# software cards lead with the money and the downloads: how many students is
# what the column is asked, and the years are worth a line of `meta` but not
# the corner. The counts are the ones in ../PROFILE.md > Supervision, and the
# student prizes are its Awards > Student Awards.

- name: "Doctoral supervision and examining"
  kind: supervision
  reach: "4 examined"
  meta: ""
  description: >-
      *Two PhD students* supervised at Sussex, one graduated. *Internal examiner* for four Sussex PhD theses, on consciousness
      science, interoception and quantitative methods.

- name: "Dissertation and placement students"
  kind: supervision
  reach: "~12/year"
  meta: ""
  description: >-
      Supervising nine undergraduate and three master's dissertations a year, two full-time
      placement students, and funded summer interns.

# The prizes were a sentence inside the card above, at four since 2025. They
# are their own card at the full count instead: it is the one line in the
# column that is not self-reported - somebody else judged the work - and
# buried in a list of numbers it read as one more of them. Counts and names
# are ../PROFILE.md > Awards > Student Awards.

- name: "Student prizes and scholarships"
  kind: supervision
  reach: "8 since 2023"
  meta: ""
  description: >-
      Students under my supervision regularly win awards for their work in my lab, including the
      *SAGE prize for outstanding application of statistical methods*, 
      the Sussex Partnership NHS Trust prize for the highest project mark, an Adam
      Weiler PhD Impact Award, and five JRA and SoCoBio summer scholarships.

