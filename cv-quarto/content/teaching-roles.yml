# The teaching roles that are not topics: what is convened and designed on the
# left (`kind: convening`), who is supervised and examined on the right
# (`kind: supervision`). Card fields, as in grants-awards.yml and software.yml.
#
# The MSc Advanced Computational Psychology programme development is curriculum
# work and would sit here, but it is the largest piece of institutional service
# on the CV, so it leads the Service section instead. It is not repeated here.

- name: "Teaching Qualifications"
  kind: convening
  reach: "FHEA"
  meta: "Advance HE · 2025 · Université Paris Cité · 2017"
  description: >-
    *Fellow of the Higher Education Academy* (FHEA, 2025; Associate Fellow
    2024), assessed against the UK Professional Standards Framework. Academic
    Teaching Certificate in pedagogy and innovative teaching (40 h, 2017).

- name: "Bayesian Statistics"
  kind: convening
  reach: "2024 -"
  meta: "University of Sussex · Module convenor"
  description: >-
    New master's and PhD module, *designed from scratch*.

- name: "Invited instruction"
  kind: convening
  reach: "2021 - 25"
  meta: "Basel · Zurich · Paris · Singapore · OHBM"
  description: >-
    Doctoral workshops on psychophysiology, Python for signal processing,
