# Service, as two columns of cards: what is run for the School and the
# University on the left (`kind: leadership`), the journals on the right
# (`kind: editorial`).
#
# Card fields, as in grants-awards.yml and software.yml.
#
# Deliberately institutional. The outward-facing work - the "Artificial
# Emotion" symposium at ESCAN 2026, the British Neuroscience Association Open
# Science Champion debate (2024), the lab blog, the media appearances and the
# consultancy - is in engagement.yml, so that this section answers one
# question: what does he run.
#
# The programme development leads the column because it is the largest piece of
# institutional work on the CV: a whole postgraduate degree rather than a seat
# on a committee.

- name: "MSc Advanced Computational Psychology"
  kind: leadership
  reach: "2026 -"
  meta: "University of Sussex · Programme developer"
  description: >-
    Design of a *new postgraduate programme* from scratch: curriculum structure,
    module content and learning outcomes.

- name: "Academic Lead, Research Participation Scheme"
  kind: leadership
  reach: "2025 -"
  meta: "University of Sussex · School of Psychology"
  description: >-
    *Redesigned the credit allocation and study approval rules* to be fairer and
    more transparent, and trialled changes raising both the educational value of
    participation and the quality of the data.

- name: "Cross-Schools Research Ethics Committee"
  kind: leadership
  reach: "2023 -"
  meta: "University of Sussex · Member"

- name: "Organiser, MORSE Seminar Series"
  kind: leadership
  url: "https://www.sussex.ac.uk/research/centres/centre-for-open-science-and-research-reform/"
  reach: "2024 -"
  meta: "Centre for Open Science and Research Reform, Sussex"
  description: >-
    *Methods for Open and Reproducible Science*: a seminar series on openness,
    reproducibility and replicability in psychological science.

